<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bitácora de Seguridad — Guardia</title>
<style>
:root {
  --teal:      #007c89;
  --teal-lt:   #71aeb7;
  --teal-pale: #e8f4f6;
  --navy:      #003660;
  --navy-lt:   #0a4a7a;
  --emerald:   #006b35;
  --dust:      #f2efec;
  --white:     #ffffff;
  --ink:       #1a2e3a;
  --ink-mid:   #3d5a66;
  --border:    #c2d8dd;
  --ok:        #006b35;
  --warn:      #c87533;
  --error:     #c0392b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--dust);
  color: var(--ink);
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--navy);
  color: var(--white);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.header-logo {
  height: 36px;
  width: auto;
}
.header-texts h1 {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--white);
  line-height: 1.2;
}
.header-texts span {
  font-size: 0.72rem;
  color: var(--teal-lt);
}
#btn-logout {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.3);
  color: var(--white);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.78rem;
  cursor: pointer;
  font-family: inherit;
}
#btn-logout:hover { background: rgba(255,255,255,0.1); }

/* ── LOGIN ── */
#pantalla-login {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  background: var(--dust);
}
.login-card {
  background: var(--white);
  border-radius: 12px;
  border: 1px solid var(--border);
  padding: 36px 28px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 4px 24px rgba(0,54,96,0.10);
}
.login-logo-wrap {
  text-align: center;
  margin-bottom: 8px;
}
.login-logo-wrap img {
  height: 64px;
  width: auto;
}
.login-modulo {
  text-align: center;
  margin-bottom: 28px;
}
.login-modulo-titulo {
  font-size: 1rem;
  font-weight: 700;
  color: var(--navy);
}
.login-modulo-sub {
  font-size: 0.78rem;
  color: var(--teal-lt);
  margin-top: 2px;
}

/* ── FORMS ── */
.form-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--ink-mid);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
input[type="text"],
input[type="password"],
select,
textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.95rem;
  color: var(--ink);
  background: var(--white);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(0,124,137,0.10);
}
textarea { resize: vertical; min-height: 80px; }

.btn-primary {
  width: 100%;
  background: var(--navy);
  color: var(--white);
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
  font-family: inherit;
}
.btn-primary:hover { background: var(--navy-lt); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-save {
  background: var(--emerald);
  color: var(--white);
  border: none;
  padding: 11px 24px;
  border-radius: 8px;
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
  font-family: inherit;
}
.btn-save:hover { background: #005a2b; }
.btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-secondary {
  background: transparent;
  color: var(--ink-mid);
  border: 1px solid var(--border);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 0.9rem;
  cursor: pointer;
  font-family: inherit;
}
.btn-secondary:hover { background: var(--dust); }

/* ── MENSAJES ── */
.mensaje {
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 0.88rem;
  font-weight: 600;
  margin-bottom: 16px;
  display: none;
}
.mensaje.ok    { background: #e6f4ec; color: var(--ok);    border: 1px solid #b6d9c3; }
.mensaje.error { background: #fdecea; color: var(--error); border: 1px solid #f5c6c2; }
.mensaje.warn  { background: #fef6ec; color: var(--warn);  border: 1px solid #f5ddb8; }

/* ── APP ── */
#pantalla-app { display: none; }
.main-container {
  max-width: 680px;
  margin: 0 auto;
  padding: 20px 16px 48px;
}

/* ── CARD ── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,54,96,0.06);
}
.card-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--teal);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--teal-pale);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── TIPO SELECTOR ── */
.tipo-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.tipo-btn {
  padding: 14px 8px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--white);
  cursor: pointer;
  text-align: center;
  transition: border-color 0.2s, background 0.2s;
  font-family: inherit;
}
.tipo-btn .tipo-icon {
  font-size: 1.5rem;
  display: block;
  margin-bottom: 5px;
}
.tipo-btn .tipo-label {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--ink-mid);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.tipo-btn:hover {
  border-color: var(--teal-lt);
  background: var(--teal-pale);
}
.tipo-btn.activo {
  border-color: var(--teal);
  background: var(--teal-pale);
}
.tipo-btn.activo .tipo-label { color: var(--teal); }

/* ── CAMPOS CONDICIONALES ── */
.campo-condicional { display: none; }
.campo-condicional.visible { display: block; }

/* ── FOTO ── */
.foto-area {
  border: 2px dashed var(--border);
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s;
}
.foto-area:hover { border-color: var(--teal-lt); }
.foto-area p { font-size: 0.83rem; color: var(--ink-mid); margin-top: 6px; }
.foto-area .foto-icono {
  width: 36px;
  height: 36px;
  margin: 0 auto;
  background: var(--teal-pale);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
}
#foto-preview {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  margin-top: 10px;
  display: none;
}
#input-foto { display: none; }
.btn-quitar-foto {
  font-size: 0.75rem;
  color: var(--error);
  cursor: pointer;
  margin-top: 6px;
  display: none;
  background: none;
  border: none;
  font-family: inherit;
  font-weight: 600;
}

/* ── CANVAS FIRMA ── */
.firma-container { margin-bottom: 16px; }
.firma-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.btn-limpiar-firma {
  font-size: 0.72rem;
  color: var(--warn);
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
  font-weight: 700;
}
canvas.firma-canvas {
  width: 100%;
  height: 130px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--white);
  touch-action: none;
  cursor: crosshair;
  display: block;
}
canvas.firma-canvas.firmado { border-color: var(--teal); }

/* ── HISTORIAL ── */
.historial-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.badge-count {
  background: var(--teal);
  color: var(--white);
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 20px;
}
.registro-item {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 10px;
  background: var(--white);
}
.registro-item:last-child { margin-bottom: 0; }
.reg-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.reg-tipo-badge {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.badge-ronda          { background: var(--teal-pale); color: var(--teal); }
.badge-incidente      { background: #fdecea; color: var(--error); }
.badge-entrega_turno  { background: #fef6ec; color: var(--warn); }
.reg-hora { font-size: 0.75rem; color: var(--ink-mid); margin-left: auto; }
.reg-punto { font-size: 0.78rem; color: var(--ink-mid); }
.reg-desc { font-size: 0.85rem; color: var(--ink); margin-top: 4px; line-height: 1.4; }
.reg-foto-thumb {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 6px;
  margin-top: 6px;
  cursor: pointer;
  border: 1px solid var(--border);
}
.reg-acciones { display: flex; gap: 8px; margin-top: 8px; }
.btn-editar-reg, .btn-eliminar-reg {
  font-size: 0.72rem;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--ink-mid);
}
.btn-eliminar-reg { color: var(--error); border-color: #f5c6c2; }
.btn-editar-reg:hover { background: var(--teal-pale); }
.btn-eliminar-reg:hover { background: #fdecea; }
.reg-editando { font-size: 0.7rem; color: var(--ink-mid); font-style: italic; }

/* ── LOADING ── */
.loading { text-align: center; padding: 28px; color: var(--ink-mid); font-size: 0.88rem; }
.spinner {
  display: inline-block;
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-bottom: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── MODAL FOTO ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.visible { display: flex; }
.modal-overlay img { max-width: 90vw; max-height: 85vh; border-radius: 10px; }

/* ── DIVISOR ENTREGA ── */
.divisor-seccion {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--teal);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 10px 0 8px;
  border-top: 1px solid var(--teal-pale);
  margin: 8px 0 14px;
}
</style>
</head>
<body>

<!-- ══════ LOGIN ══════ -->
<div id="pantalla-login">
  <div class="login-card">
    <div class="login-logo-wrap">
      <img src="PDM_Logo_Transparent.png" alt="Paraíso del Mar">
    </div>
    <div class="login-modulo">
      <div class="login-modulo-titulo">📋 Bitácora de Seguridad</div>
      <div class="login-modulo-sub">Acceso para guardias</div>
    </div>
    <div id="msg-login" class="mensaje"></div>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="login-usuario" placeholder="Tu nombre de usuario" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="btn-login">Entrar</button>
  </div>
</div>

<!-- ══════ APP ══════ -->
<div id="pantalla-app">
  <header>
    <div class="header-left">
      <img src="PDM_Logo_Transparent.png" alt="Paraíso del Mar" class="header-logo">
      <div class="header-texts">
        <h1>📋 Bitácora de Seguridad</h1>
        <span id="header-nombre"></span>
      </div>
    </div>
    <button id="btn-logout">Salir</button>
  </header>

  <div class="main-container">
    <div id="msg-app" class="mensaje"></div>

    <!-- NUEVO REGISTRO -->
    <div class="card">
      <div class="card-title">📋 Nuevo Registro</div>

      <div class="tipo-selector">
        <button class="tipo-btn" data-tipo="ronda">
          <span class="tipo-icon">🔦</span>
          <span class="tipo-label">Ronda</span>
        </button>
        <button class="tipo-btn" data-tipo="incidente">
          <span class="tipo-icon">⚠️</span>
          <span class="tipo-label">Incidente</span>
        </button>
        <button class="tipo-btn" data-tipo="entrega_turno">
          <span class="tipo-icon">🔄</span>
          <span class="tipo-label">Entrega Turno</span>
        </button>
      </div>

      <div id="seccion-campos" style="display:none">
        <div class="form-group">
          <label>Punto de Acceso</label>
          <select id="campo-punto">
            <option value="">— Selecciona —</option>
            <option value="muelle">Muelle Principal</option>
            <option value="base4">Base 4</option>
            <option value="base1">Base 1</option>
          </select>
        </div>

        <div class="form-group">
          <label>Descripción <span id="desc-requerido" style="color:var(--error);display:none">*</span></label>
          <textarea id="campo-descripcion" placeholder="Describe lo observado... (mínimo 10 caracteres)"></textarea>
        </div>

        <div class="form-group">
          <label>Observaciones <span style="color:var(--ink-mid);font-weight:400;font-size:0.72rem">(opcional)</span></label>
          <textarea id="campo-observaciones" placeholder="Notas adicionales..."></textarea>
        </div>

        <div class="form-group">
          <label>Foto <span style="color:var(--ink-mid);font-weight:400;font-size:0.72rem">(opcional)</span></label>
          <div class="foto-area" id="foto-area" onclick="document.getElementById('input-foto').click()">
            <div class="foto-icono">📷</div>
            <p>Toca para abrir la cámara</p>
            <img id="foto-preview" alt="preview">
          </div>
          <button class="btn-quitar-foto" id="btn-quitar-foto" onclick="quitarFoto()">✕ Quitar foto</button>
          <input type="file" id="input-foto" accept="image/*" capture="environment">
        </div>

        <!-- Bloque entrega de turno -->
        <div class="campo-condicional" id="bloque-entrega">
          <div class="divisor-seccion">Datos de entrega de turno</div>
          <div class="firma-container">
            <div class="firma-label-row">
              <label style="margin:0">Firma Guardia Saliente</label>
              <button class="btn-limpiar-firma" onclick="limpiarFirma('firma-saliente')">Limpiar</button>
            </div>
            <canvas class="firma-canvas" id="firma-saliente"></canvas>
          </div>
          <div class="form-group">
            <label>Guardia Entrante</label>
            <select id="campo-guardia-entrante">
              <option value="">— Selecciona guardia entrante —</option>
            </select>
          </div>
          <div class="firma-container">
            <div class="firma-label-row">
              <label style="margin:0">Firma Guardia Entrante</label>
              <button class="btn-limpiar-firma" onclick="limpiarFirma('firma-entrante')">Limpiar</button>
            </div>
            <canvas class="firma-canvas" id="firma-entrante"></canvas>
          </div>
        </div>

        <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px">
          <button class="btn-secondary" onclick="resetFormulario()">Cancelar</button>
          <button class="btn-save" id="btn-guardar" onclick="guardarRegistro()">Guardar Registro</button>
        </div>
      </div>

      <div id="estado-vacio-form" style="text-align:center;padding:24px 0;color:var(--ink-mid);font-size:0.85rem">
        Selecciona el tipo de registro para comenzar
      </div>
    </div>

    <!-- HISTORIAL DEL DÍA -->
    <div class="card">
      <div class="historial-header">
        <div class="card-title" style="margin:0;border:none;padding:0">📋 Registros de Hoy</div>
        <span class="badge-count" id="badge-total">0</span>
      </div>
      <div id="historial-container">
        <div class="loading"><div class="spinner"></div><br>Cargando...</div>
      </div>
    </div>
  </div>
</div>

<!-- Modal foto ampliada -->
<div class="modal-overlay" id="modal-foto" onclick="this.classList.remove('visible')">
  <img id="modal-foto-img" src="" alt="foto registro">
</div>

<script>
const API = 'https://paraiso-del-mar-backend.onrender.com';
let token = null;
let usuarioActual = null;
let tipoSeleccionado = null;
let fotoBase64 = null;
let fotoFile = null;
let modoEdicion = null;
const firmaStates = {};

// ══ AUTH ══
document.getElementById('btn-login').addEventListener('click', async () => {
  const usuario = document.getElementById('login-usuario').value.trim();
  const password = document.getElementById('login-password').value.trim();
  if (!usuario || !password) return mostrarMsg('msg-login', 'Completa usuario y contraseña', 'error');
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre: usuario, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.mensaje || 'Credenciales incorrectas');
    token = data.token;
    usuarioActual = data.usuario || data;
    sessionStorage.setItem('pdm_acceso_token', token);
    iniciarApp();
  } catch(e) {
    mostrarMsg('msg-login', e.message, 'error');
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});

document.getElementById('login-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-login').click();
});

document.getElementById('btn-logout').addEventListener('click', () => {
  sessionStorage.removeItem('pdm_acceso_token');
  token = null; usuarioActual = null;
  document.getElementById('pantalla-app').style.display = 'none';
  document.getElementById('pantalla-login').style.display = 'flex';
  resetFormulario();
});

function iniciarApp() {
  document.getElementById('pantalla-login').style.display = 'none';
  document.getElementById('pantalla-app').style.display = 'block';
  document.getElementById('header-nombre').textContent = usuarioActual.nombre || '';
  cargarGuardias();
  cargarHistorial();
  initFirmas();
}

async function fetchConAuth(url, opciones = {}) {
  const res = await fetch(url, {
    ...opciones,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...opciones.headers
    }
  });
  if (res.status === 401) { sessionStorage.removeItem('pdm_acceso_token'); location.reload(); }
  return res;
}

// ══ TIPO ══
document.querySelectorAll('.tipo-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    tipoSeleccionado = btn.dataset.tipo;
    document.getElementById('seccion-campos').style.display = 'block';
    document.getElementById('estado-vacio-form').style.display = 'none';
    document.getElementById('bloque-entrega').classList.toggle('visible', tipoSeleccionado === 'entrega_turno');
    document.getElementById('desc-requerido').style.display = tipoSeleccionado === 'incidente' ? 'inline' : 'none';
    if (modoEdicion) resetFormulario();
  });
});

// ══ FOTO ══
document.getElementById('input-foto').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  fotoFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    fotoBase64 = ev.target.result;
    document.getElementById('foto-preview').src = fotoBase64;
    document.getElementById('foto-preview').style.display = 'block';
    document.getElementById('btn-quitar-foto').style.display = 'inline';
  };
  reader.readAsDataURL(file);
});

function quitarFoto() {
  fotoFile = null; fotoBase64 = null;
  document.getElementById('foto-preview').style.display = 'none';
  document.getElementById('btn-quitar-foto').style.display = 'none';
  document.getElementById('input-foto').value = '';
}

// ══ FIRMAS ══
function initFirmas() {
  ['firma-saliente', 'firma-entrante'].forEach(id => {
    const canvas = document.getElementById(id);
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width  = (rect.width  || 600) * dpr;
    canvas.height = (rect.height || 130) * dpr;
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = '#1a2e3a';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    firmaStates[id] = { dibujando: false, ctx, canvas, firmado: false };
    canvas.addEventListener('pointerdown', e => { e.preventDefault(); const s = firmaStates[id]; s.dibujando = true; const p = getPos(canvas, e); s.ctx.beginPath(); s.ctx.moveTo(p.x, p.y); });
    canvas.addEventListener('pointermove', e => { e.preventDefault(); const s = firmaStates[id]; if (!s.dibujando) return; const p = getPos(canvas, e); s.ctx.lineTo(p.x, p.y); s.ctx.stroke(); if (!s.firmado) { s.firmado = true; canvas.classList.add('firmado'); } });
    canvas.addEventListener('pointerup',    () => { firmaStates[id].dibujando = false; });
    canvas.addEventListener('pointerleave', () => { firmaStates[id].dibujando = false; });
  });
}
function getPos(canvas, e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function limpiarFirma(id) {
  const s = firmaStates[id];
  const r = s.canvas.getBoundingClientRect();
  s.ctx.clearRect(0, 0, r.width, r.height);
  s.firmado = false;
  s.canvas.classList.remove('firmado');
}
function getFirmaDataURL(id) {
  const s = firmaStates[id];
  return s.firmado ? s.canvas.toDataURL('image/png') : null;
}

// ══ GUARDIAS ══
async function cargarGuardias() {
  try {
    const res = await fetch(`${API}/api/auth/usuarios-publico`);
    const data = await res.json();
    const sel = document.getElementById('campo-guardia-entrante');
    sel.innerHTML = '<option value="">— Selecciona guardia entrante —</option>';
    const lista = data.usuarios || data.data || data || [];
    lista.forEach(u => {
      if (u.id !== usuarioActual?.id) {
        const opt = document.createElement('option');
        opt.value = u.id; opt.textContent = u.nombre;
        sel.appendChild(opt);
      }
    });
  } catch(e) { console.warn('No se pudieron cargar guardias', e); }
}

// ══ GUARDAR ══
async function guardarRegistro() {
  if (!tipoSeleccionado) return mostrarMsg('msg-app', 'Selecciona el tipo de registro', 'warn');
  const punto       = document.getElementById('campo-punto').value;
  const descripcion = document.getElementById('campo-descripcion').value.trim();
  const observaciones = document.getElementById('campo-observaciones').value.trim();
  if (!punto) return mostrarMsg('msg-app', 'Selecciona el punto de acceso', 'warn');
  if (!descripcion || descripcion.length < 10)
    return mostrarMsg('msg-app', 'La descripción debe tener al menos 10 caracteres', 'warn');

  const body = { tipo: tipoSeleccionado, punto_acceso: punto, descripcion, observaciones };

  if (tipoSeleccionado === 'entrega_turno') {
    const firmaSal  = getFirmaDataURL('firma-saliente');
    const firmaEnt  = getFirmaDataURL('firma-entrante');
    const guardiaEnt = document.getElementById('campo-guardia-entrante').value;
    if (!firmaSal)    return mostrarMsg('msg-app', 'Falta la firma del guardia saliente', 'warn');
    if (!firmaEnt)    return mostrarMsg('msg-app', 'Falta la firma del guardia entrante', 'warn');
    if (!guardiaEnt)  return mostrarMsg('msg-app', 'Selecciona el guardia entrante', 'warn');
    body.firma_saliente      = firmaSal;
    body.firma_entrante      = firmaEnt;
    body.guardia_entrante_id = parseInt(guardiaEnt);
  }

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const url    = modoEdicion ? `${API}/api/bitacoras/${modoEdicion}` : `${API}/api/bitacoras`;
    const method = modoEdicion ? 'PUT' : 'POST';
    const res  = await fetchConAuth(url, { method, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.mensaje || 'Error al guardar');
    const registroId = data.id || data.data?.id || modoEdicion;
    if (fotoFile && registroId && !modoEdicion) await subirFoto(registroId);
    mostrarMsg('msg-app', modoEdicion ? 'Registro actualizado' : 'Registro guardado correctamente', 'ok');
    resetFormulario();
    cargarHistorial();
  } catch(e) {
    mostrarMsg('msg-app', e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar Registro';
  }
}

async function subirFoto(registroId) {
  const formData = new FormData();
  formData.append('foto', fotoFile);
  formData.append('registro_id', registroId);
  await fetch(`${API}/api/bitacoras/upload-foto`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}` },
    body: formData
  });
}

// ══ HISTORIAL ══
async function cargarHistorial() {
  const container = document.getElementById('historial-container');
  container.innerHTML = '<div class="loading"><div class="spinner"></div><br>Cargando registros...</div>';
  try {
    const hoy = new Date().toISOString().split('T')[0];
    const res = await fetchConAuth(`${API}/api/bitacoras?fecha_desde=${hoy}&fecha_hasta=${hoy}`);
    const data = await res.json();
    const registros = data.data?.registros || data.registros || data.data || data || [];
    document.getElementById('badge-total').textContent = registros.length;
    if (!registros.length) {
      container.innerHTML = '<div class="loading">Sin registros hoy</div>';
      return;
    }
    container.innerHTML = '';
    registros.forEach(r => container.appendChild(crearItem(r)));
  } catch(e) {
    container.innerHTML = '<div class="loading">Error al cargar registros</div>';
  }
}

function crearItem(r) {
  const div = document.createElement('div');
  div.className = 'registro-item';
  const hora = new Date(r.created_at).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  const puntos = { muelle: 'Muelle Principal', base4: 'Base 4', base1: 'Base 1' };
  const tipos  = { ronda: 'Ronda', incidente: 'Incidente', entrega_turno: 'Entrega Turno' };
  const puedeEditar = (new Date() - new Date(r.created_at)) / 60000 <= 5;
  div.innerHTML = `
    <div class="reg-header">
      <span class="reg-tipo-badge badge-${r.tipo}">${tipos[r.tipo] || r.tipo}</span>
      <span class="reg-punto">${puntos[r.punto_acceso] || r.punto_acceso}</span>
      <span class="reg-hora">${hora}</span>
    </div>
    ${r.descripcion ? `<div class="reg-desc">${r.descripcion}</div>` : ''}
    ${r.observaciones ? `<div class="reg-desc" style="color:var(--ink-mid);font-size:0.8rem">${r.observaciones}</div>` : ''}
    ${r.foto_url ? `<img class="reg-foto-thumb" src="${r.foto_url}" alt="foto" onclick="abrirFoto('${r.foto_url}')">` : ''}
    <div class="reg-acciones">
      ${puedeEditar
        ? `<button class="btn-editar-reg" onclick="editarRegistro(${r.id})">Editar</button>
           <button class="btn-eliminar-reg" onclick="eliminarRegistro(${r.id})">Eliminar</button>`
        : `<span class="reg-editando">Editable solo 5 min después de crear</span>`}
    </div>`;
  return div;
}

async function eliminarRegistro(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  try {
    const res = await fetchConAuth(`${API}/api/bitacoras/${id}`, { method: 'DELETE' });
    if (!res.ok) { const d = await res.json(); throw new Error(d.mensaje || 'Error'); }
    mostrarMsg('msg-app', 'Registro eliminado', 'ok');
    cargarHistorial();
  } catch(e) { mostrarMsg('msg-app', e.message, 'error'); }
}

async function editarRegistro(id) {
  try {
    const res = await fetchConAuth(`${API}/api/bitacoras/${id}`);
    const data = await res.json();
    const r = data.data || data;
    modoEdicion = id;
    tipoSeleccionado = r.tipo;
    document.querySelectorAll('.tipo-btn').forEach(b => b.classList.toggle('activo', b.dataset.tipo === r.tipo));
    document.getElementById('seccion-campos').style.display = 'block';
    document.getElementById('estado-vacio-form').style.display = 'none';
    document.getElementById('campo-punto').value = r.punto_acceso || '';
    document.getElementById('campo-descripcion').value = r.descripcion || '';
    document.getElementById('campo-observaciones').value = r.observaciones || '';
    document.getElementById('bloque-entrega').classList.toggle('visible', r.tipo === 'entrega_turno');
    document.getElementById('btn-guardar').textContent = 'Actualizar Registro';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    mostrarMsg('msg-app', 'Modo edición — modifica y guarda', 'warn');
  } catch(e) { mostrarMsg('msg-app', 'No se pudo cargar el registro', 'error'); }
}

function resetFormulario() {
  tipoSeleccionado = null; modoEdicion = null;
  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('activo'));
  document.getElementById('seccion-campos').style.display = 'none';
  document.getElementById('estado-vacio-form').style.display = 'block';
  document.getElementById('campo-punto').value = '';
  document.getElementById('campo-descripcion').value = '';
  document.getElementById('campo-observaciones').value = '';
  document.getElementById('bloque-entrega').classList.remove('visible');
  document.getElementById('btn-guardar').textContent = 'Guardar Registro';
  quitarFoto();
  if (firmaStates['firma-saliente']) limpiarFirma('firma-saliente');
  if (firmaStates['firma-entrante']) limpiarFirma('firma-entrante');
}

// ══ UTILS ══
function mostrarMsg(id, texto, tipo = 'ok') {
  const el = document.getElementById(id);
  el.textContent = texto; el.className = `mensaje ${tipo}`; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}
function abrirFoto(url) {
  document.getElementById('modal-foto-img').src = url;
  document.getElementById('modal-foto').classList.add('visible');
}

// Auto-login
window.addEventListener('DOMContentLoaded', () => {
  const t = sessionStorage.getItem('pdm_acceso_token');
  if (t) {
    token = t;
    try {
      const payload = JSON.parse(atob(t.split('.')[1]));
      usuarioActual = payload;
      iniciarApp();
    } catch(e) { sessionStorage.removeItem('pdm_acceso_token'); }
  }
});
</script>
